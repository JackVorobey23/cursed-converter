<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursed Converter</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #14141b;
        --panel-2: #191922;
        --border: #262633;
        --text: #ececf2;
        --dim: #9494a8;
        --accent: #34d399;
        --accent-ink: #04150d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 40px 20px 12px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0.4px;
      }

      .sub {
        color: var(--dim);
        margin-top: 8px;
        font-size: 14px;
      }

      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 16px 48px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }

      /* ---------- Image cards ---------- */

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .card-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--dim);
      }

      .mini-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }

      .mini-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .drop-area {
        position: relative;
        aspect-ratio: 1 / 1;
        background: var(--panel-2);
        cursor: pointer;
        transition: background 0.15s;
      }

      .drop-area:hover,
      .drop-area.drag {
        background: #1e1e29;
      }

      .drop-area.drag {
        outline: 2px dashed var(--accent);
        outline-offset: -6px;
      }

      .drop-area canvas.preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .drop-area input[type="file"] {
        display: none;
      }

      .drop-hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        font-size: 13px;
        pointer-events: none;
      }

      /* hint disappears once an image is loaded */
      .drop-area.has-image .drop-hint {
        display: none;
      }

      .card-foot {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }

      .card-foot button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        font-size: 12px;
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }

      .card-foot button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ---------- Controls ---------- */

      .controls {
        grid-column: 1 / -1;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 28px;
        align-items: start;
      }

      .ctl {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .ctl .ctl-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .ctl label {
        font-size: 12px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 600;
      }

      .ctl output {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      select:hover,
      select:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .convert-row {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        margin-top: 4px;
      }

      /* ---------- Buttons ---------- */

      .btn {
        background: var(--accent);
        color: var(--accent-ink);
        border: 0;
        border-radius: 10px;
        padding: 12px 26px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .btn.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn.ghost:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ---------- Stage ---------- */

      .stage {
        grid-column: 1 / -1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      canvas#canvas {
        max-width: 100%;
        image-rendering: pixelated;
        border-radius: 10px;
        background: #000;
      }

      .status {
        color: var(--dim);
        font-size: 13px;
        min-height: 18px;
        text-align: center;
      }

      .status b {
        color: var(--accent);
        font-weight: 600;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Cursed Converter</h1>
      <div class="sub">Morph any image into any other image.</div>
    </header>

    <main>
      <!-- Source -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">Source</span>
          <button
            type="button"
            class="mini-btn"
            id="pasteSrcBtn"
            title="Paste image from clipboard (Ctrl+V)"
          >
            Paste
          </button>
        </div>
        <div class="drop-area" id="dropSrc">
          <canvas class="preview" id="prevSrc"></canvas>
          <div class="drop-hint">Drop an image, paste, or click to browse</div>
          <input type="file" id="fileSrc" accept="image/*" />
        </div>
        <div class="card-foot">
          <button
            type="button"
            onclick="
              event.stopPropagation();
              loadSample('wheel', 'src');
            "
          >
            Color Wheel
          </button>
          <button
            type="button"
            onclick="
              event.stopPropagation();
              loadSample('checker', 'src');
            "
          >
            Stripes
          </button>
        </div>
      </section>

      <!-- Target -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">Target</span>
          <button
            type="button"
            class="mini-btn"
            id="pasteTgtBtn"
            title="Paste image from clipboard (Ctrl+V)"
          >
            Paste
          </button>
        </div>
        <div class="drop-area" id="dropTgt">
          <canvas class="preview" id="prevTgt"></canvas>
          <div class="drop-hint">Drop an image, paste, or click to browse</div>
          <input type="file" id="fileTgt" accept="image/*" />
        </div>
        <div class="card-foot">
          <button
            type="button"
            onclick="
              event.stopPropagation();
              loadSample('smiley', 'tgt');
            "
          >
            Smiley
          </button>
          <button
            type="button"
            onclick="
              event.stopPropagation();
              loadSample('rings', 'tgt');
            "
          >
            Rings
          </button>
        </div>
      </section>

      <!-- Controls -->
      <section class="card controls">
        <div class="ctl">
          <div class="ctl-head">
            <label for="res">Resolution</label>
            <output id="resVal">208 × 208</output>
          </div>
          <input
            type="range"
            id="res"
            min="32"
            max="512"
            step="16"
            value="208"
          />
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <label for="prox">Proximity weight</label>
            <output id="proxVal">0.3</output>
          </div>
          <input
            type="range"
            id="prox"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <label for="dur">Morph duration</label>
            <output id="durVal">3.3 s</output>
          </div>
          <input
            type="range"
            id="dur"
            min="0.5"
            max="10"
            step="0.1"
            value="3.3"
          />
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <label for="holdSrc">Source hold time</label>
            <output id="holdSrcVal">2.0 s</output>
          </div>
          <input
            type="range"
            id="holdSrc"
            min="1"
            max="10"
            step="0.5"
            value="2"
          />
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <label for="holdTgt">Final hold time</label>
            <output id="holdTgtVal">2.0 s</output>
          </div>
          <input
            type="range"
            id="holdTgt"
            min="1"
            max="10"
            step="0.5"
            value="2"
          />
        </div>
        <div class="ctl">
          <label for="fps">GIF frame rate</label>
          <select id="fps">
            <option value="15">15 fps</option>
            <option value="24">24 fps</option>
            <option value="30">30 fps</option>
            <option value="60" selected>60 fps</option>
          </select>
        </div>
        <div class="convert-row">
          <button class="btn" id="convert">Convert</button>
        </div>
      </section>

      <!-- Stage -->
      <section class="card stage">
        <div class="row">
          <button class="btn ghost" id="replay" disabled>Replay</button>
          <button class="btn" id="saveGif" disabled>Export GIF</button>
          <button class="btn ghost" id="saveVideo" disabled>
            Export Video
          </button>
        </div>
        <canvas id="canvas" width="512" height="512"></canvas>
        <div class="status" id="status">
          Ready. Load two images, then press Convert.
        </div>
      </section>
    </main>

    <script>
      "use strict";

      // --- Fast 5D Bipartite Partitioning Solver ---
      const LEAF_SIZE = 16;

      function solve5DBipartite(srcColors, tgtColors, N, proximity) {
        const n = N * N;
        const spatialScale = proximity * 1.5;

        const src5D = new Float32Array(n * 5);
        const tgt5D = new Float32Array(n * 5);

        for (let i = 0; i < n; i++) {
          const i3 = i * 3,
            i5 = i * 5;
          const x = (i % N) / N;
          const y = ((i / N) | 0) / N;

          src5D[i5] = srcColors[i3];
          src5D[i5 + 1] = srcColors[i3 + 1];
          src5D[i5 + 2] = srcColors[i3 + 2];
          src5D[i5 + 3] = x * spatialScale;
          src5D[i5 + 4] = y * spatialScale;

          tgt5D[i5] = tgtColors[i3];
          tgt5D[i5 + 1] = tgtColors[i3 + 1];
          tgt5D[i5 + 2] = tgtColors[i3 + 2];
          tgt5D[i5 + 3] = x * spatialScale;
          tgt5D[i5 + 4] = y * spatialScale;
        }

        const srcIdx = new Int32Array(n);
        const tgtIdx = new Int32Array(n);
        for (let i = 0; i < n; i++) {
          srcIdx[i] = i;
          tgtIdx[i] = i;
        }

        const assigned = new Int32Array(n);

        function partition(arr, data, dim, left, right, pivotIdx) {
          const pivotVal = data[arr[pivotIdx] * 5 + dim];
          let tmp = arr[pivotIdx];
          arr[pivotIdx] = arr[right];
          arr[right] = tmp;
          let store = left;
          for (let i = left; i < right; i++) {
            if (data[arr[i] * 5 + dim] < pivotVal) {
              tmp = arr[store];
              arr[store] = arr[i];
              arr[i] = tmp;
              store++;
            }
          }
          tmp = arr[right];
          arr[right] = arr[store];
          arr[store] = tmp;
          return store;
        }

        function quickselect(arr, data, dim, left, right, k) {
          while (left < right) {
            const pivotIdx = left + ((right - left) >> 1);
            const newPivot = partition(arr, data, dim, left, right, pivotIdx);
            if (newPivot === k) return;
            if (k < newPivot) right = newPivot - 1;
            else left = newPivot + 1;
          }
        }

        function solveNode(start, end) {
          const len = end - start;
          if (len <= LEAF_SIZE) {
            if (len === 1) {
              assigned[tgtIdx[start]] = srcIdx[start];
              return;
            }
            const pairs = [];
            for (let i = 0; i < len; i++) {
              const si = srcIdx[start + i];
              const so = si * 5;
              for (let j = 0; j < len; j++) {
                const tj = tgtIdx[start + j];
                const to = tj * 5;
                const d0 = src5D[so] - tgt5D[to];
                const d1 = src5D[so + 1] - tgt5D[to + 1];
                const d2 = src5D[so + 2] - tgt5D[to + 2];
                const d3 = src5D[so + 3] - tgt5D[to + 3];
                const d4 = src5D[so + 4] - tgt5D[to + 4];
                pairs.push({
                  i,
                  j,
                  distSq: d0 * d0 + d1 * d1 + d2 * d2 + d3 * d3 + d4 * d4,
                });
              }
            }
            pairs.sort((a, b) => a.distSq - b.distSq);

            const sUsed = new Uint8Array(len);
            const tUsed = new Uint8Array(len);
            let matched = 0;
            for (let k = 0; k < pairs.length && matched < len; k++) {
              const { i, j } = pairs[k];
              if (!sUsed[i] && !tUsed[j]) {
                sUsed[i] = 1;
                tUsed[j] = 1;
                assigned[tgtIdx[start + j]] = srcIdx[start + i];
                matched++;
              }
            }
            return;
          }

          let bestDim = 0,
            maxSpread = -1;
          for (let d = 0; d < 5; d++) {
            let sMin = src5D[srcIdx[start] * 5 + d],
              sMax = sMin;
            let tMin = tgt5D[tgtIdx[start] * 5 + d],
              tMax = tMin;
            for (let i = start + 1; i < end; i++) {
              const sv = src5D[srcIdx[i] * 5 + d];
              if (sv < sMin) sMin = sv;
              else if (sv > sMax) sMax = sv;
              const tv = tgt5D[tgtIdx[i] * 5 + d];
              if (tv < tMin) tMin = tv;
              else if (tv > tMax) tMax = tv;
            }
            const spread = sMax - sMin + (tMax - tMin);
            if (spread > maxSpread) {
              maxSpread = spread;
              bestDim = d;
            }
          }

          const mid = start + (len >> 1);
          quickselect(srcIdx, src5D, bestDim, start, end - 1, mid);
          quickselect(tgtIdx, tgt5D, bestDim, start, end - 1, mid);

          solveNode(start, mid);
          solveNode(mid, end);
        }

        solveNode(0, n);

        function distSq(si, tj) {
          const so = si * 5,
            to = tj * 5;
          const d0 = src5D[so] - tgt5D[to],
            d1 = src5D[so + 1] - tgt5D[to + 1],
            d2 = src5D[so + 2] - tgt5D[to + 2];
          const d3 = src5D[so + 3] - tgt5D[to + 3],
            d4 = src5D[so + 4] - tgt5D[to + 4];
          return d0 * d0 + d1 * d1 + d2 * d2 + d3 * d3 + d4 * d4;
        }

        for (let pass = 0; pass < 2; pass++) {
          for (let y = 0; y < N; y++) {
            for (let x = 0; x < N; x++) {
              const j1 = y * N + x;
              const s1 = assigned[j1];

              if (x + 1 < N) {
                const j2 = j1 + 1;
                const s2 = assigned[j2];
                if (
                  distSq(s2, j1) + distSq(s1, j2) <
                  distSq(s1, j1) + distSq(s2, j2)
                ) {
                  assigned[j1] = s2;
                  assigned[j2] = s1;
                  continue;
                }
              }
              if (y + 1 < N) {
                const j2 = j1 + N;
                const s2 = assigned[j2];
                if (
                  distSq(s2, j1) + distSq(s1, j2) <
                  distSq(s1, j1) + distSq(s2, j2)
                ) {
                  assigned[j1] = s2;
                  assigned[j2] = s1;
                }
              }
            }
          }
        }

        return assigned;
      }

      // --- Canvas Blitting & Pixels Extraction ---

      function getGridPixels(canvasOrImg, N) {
        const off = document.createElement("canvas");
        off.width = off.height = N;
        const ctx = off.getContext("2d", { willReadFrequently: true });
        const w = canvasOrImg.width,
          h = canvasOrImg.height;
        const s = Math.min(w, h);
        ctx.drawImage(canvasOrImg, (w - s) / 2, (h - s) / 2, s, s, 0, 0, N, N);
        const data = ctx.getImageData(0, 0, N, N).data;
        const out = new Float32Array(N * N * 3);
        for (let i = 0; i < N * N; i++) {
          out[i * 3] = data[i * 4] / 255;
          out[i * 3 + 1] = data[i * 4 + 1] / 255;
          out[i * 3 + 2] = data[i * 4 + 2] / 255;
        }
        return out;
      }

      const easeInOutCubic = (p) =>
        p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

      function createFastRenderer(canvas, sourceColors, assigned, N) {
        const n = N * N;
        // One canvas pixel per cell: the canvas size *is* the resolution
        // setting, so the preview, the GIF and the video all come out at N×N.
        // Cell squares are 1 px, which also means they can never overlap.
        const size = N;
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");
        const imgData = ctx.createImageData(size, size);
        const buf = new Uint32Array(imgData.data.buffer);
        const cell = size / N;
        const block = Math.ceil(cell);

        const colors = new Uint32Array(n);
        for (let i = 0; i < n; i++) {
          const r = (sourceColors[i * 3] * 255) | 0;
          const g = (sourceColors[i * 3 + 1] * 255) | 0;
          const b = (sourceColors[i * 3 + 2] * 255) | 0;
          colors[i] = 0xff000000 | (b << 16) | (g << 8) | r;
        }

        const fromX = new Float32Array(n),
          fromY = new Float32Array(n);
        const toX = new Float32Array(n),
          toY = new Float32Array(n);

        for (let j = 0; j < n; j++) {
          const i = assigned[j];
          toX[i] = (j % N) * cell;
          toY[i] = ((j / N) | 0) * cell;
        }
        for (let i = 0; i < n; i++) {
          fromX[i] = (i % N) * cell;
          fromY[i] = ((i / N) | 0) * cell;
        }

        const limit = size - block;

        return {
          size,
          colors,
          drawFrame(p) {
            const e = easeInOutCubic(p);
            buf.fill(0xff000000);
            for (let i = 0; i < n; i++) {
              let x = fromX[i] + (toX[i] - fromX[i]) * e;
              let y = fromY[i] + (toY[i] - fromY[i]) * e;
              x = x < 0 ? 0 : x > limit ? limit : x | 0;
              y = y < 0 ? 0 : y > limit ? limit : y | 0;
              const c = colors[i];
              for (let dy = 0; dy < block; dy++) {
                const row = (y + dy) * size + x;
                for (let dx = 0; dx < block; dx++) buf[row + dx] = c;
              }
            }
            ctx.putImageData(imgData, 0, 0);
          },
        };
      }

      let activeAnim = null;
      function animateMorph(renderer, durationMs, holdStartMs = 0, holdEndMs = 0) {
        if (activeAnim) cancelAnimationFrame(activeAnim);
        return new Promise((resolve) => {
          let t0 = null;
          function step(ts) {
            if (t0 === null) t0 = ts;
            const elapsed = ts - t0;
            let p;
            if (elapsed < holdStartMs) p = 0;
            else p = Math.min((elapsed - holdStartMs) / durationMs, 1);
            renderer.drawFrame(p);
            if (p < 1 || elapsed < holdStartMs + durationMs + holdEndMs)
              activeAnim = requestAnimationFrame(step);
            else {
              activeAnim = null;
              resolve();
            }
          }
          activeAnim = requestAnimationFrame(step);
        });
      }

      // --- Per-Frame Local Color Table & Floyd-Steinberg Dithering ---

      function medianCutPalette(samples, target) {
        const rangeOf = (box) => {
          let lo0 = 255,
            lo1 = 255,
            lo2 = 255,
            hi0 = 0,
            hi1 = 0,
            hi2 = 0;
          for (let i = 0; i < box.length; i++) {
            const c = box[i];
            if (c[0] < lo0) lo0 = c[0];
            if (c[0] > hi0) hi0 = c[0];
            if (c[1] < lo1) lo1 = c[1];
            if (c[1] > hi1) hi1 = c[1];
            if (c[2] < lo2) lo2 = c[2];
            if (c[2] > hi2) hi2 = c[2];
          }
          return [hi0 - lo0, hi1 - lo1, hi2 - lo2];
        };

        const boxes = [samples];
        while (boxes.length < target) {
          let best = -1,
            bestRange = 0,
            bestCh = 0;
          for (let b = 0; b < boxes.length; b++) {
            if (boxes[b].length <= 1) continue;
            const r = rangeOf(boxes[b]);
            const m = Math.max(r[0], r[1], r[2]);
            if (m > bestRange) {
              bestRange = m;
              best = b;
              bestCh = r.indexOf(m);
            }
          }
          if (best === -1 || bestRange === 0) break;
          const box = boxes[best];
          box.sort((a, c) => a[bestCh] - c[bestCh]);
          const mid = box.length >> 1;
          boxes.splice(best, 1, box.slice(0, mid), box.slice(mid));
        }

        return boxes.map((box) => {
          let s0 = 0,
            s1 = 0,
            s2 = 0;
          for (let i = 0; i < box.length; i++) {
            s0 += box[i][0];
            s1 += box[i][1];
            s2 += box[i][2];
          }
          const len = box.length;
          return [(s0 / len) | 0, (s1 / len) | 0, (s2 / len) | 0];
        });
      }

      function quantizeFrameTrueColor(rgba, width, height) {
        const total = width * height;
        const step = Math.max(1, Math.floor(total / 4000));
        const samples = [];
        for (let i = 0; i < total; i += step) {
          const idx = i * 4;
          samples.push([rgba[idx], rgba[idx + 1], rgba[idx + 2]]);
        }

        const palette = medianCutPalette(samples, 256);
        while (palette.length < 256) palette.push([0, 0, 0]);

        const cache = new Int16Array(32768).fill(-1);

        function getClosest(r, g, b) {
          const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
          const cached = cache[key];
          if (cached !== -1) return cached;

          let best = 0,
            bestDist = Infinity;
          for (let p = 0; p < 256; p++) {
            const dr = r - palette[p][0];
            const dg = g - palette[p][1];
            const db = b - palette[p][2];
            const dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) {
              bestDist = dist;
              best = p;
            }
          }
          cache[key] = best;
          return best;
        }

        const indices = new Uint8Array(total);
        let curErr = new Float32Array((width + 2) * 3);
        let nextErr = new Float32Array((width + 2) * 3);

        for (let y = 0; y < height; y++) {
          const rowOff = y * width;
          for (let x = 0; x < width; x++) {
            const srcIdx = (rowOff + x) * 4;
            const errIdx = (x + 1) * 3;

            let r = rgba[srcIdx] + curErr[errIdx];
            let g = rgba[srcIdx + 1] + curErr[errIdx + 1];
            let b = rgba[srcIdx + 2] + curErr[errIdx + 2];

            r = r < 0 ? 0 : r > 255 ? 255 : r;
            g = g < 0 ? 0 : g > 255 ? 255 : g;
            b = b < 0 ? 0 : b > 255 ? 255 : b;

            const pIdx = getClosest(r | 0, g | 0, b | 0);
            indices[rowOff + x] = pIdx;

            const pal = palette[pIdx];
            const er = r - pal[0];
            const eg = g - pal[1];
            const eb = b - pal[2];

            curErr[errIdx + 3] += (er * 7) / 16;
            curErr[errIdx + 4] += (eg * 7) / 16;
            curErr[errIdx + 5] += (eb * 7) / 16;

            nextErr[errIdx - 3] += (er * 3) / 16;
            nextErr[errIdx - 2] += (eg * 3) / 16;
            nextErr[errIdx - 1] += (eb * 3) / 16;

            nextErr[errIdx] += (er * 5) / 16;
            nextErr[errIdx + 1] += (eg * 5) / 16;
            nextErr[errIdx + 2] += (eb * 5) / 16;

            nextErr[errIdx + 3] += (er * 1) / 16;
            nextErr[errIdx + 4] += (eg * 1) / 16;
            nextErr[errIdx + 5] += (eb * 1) / 16;
          }

          const tmp = curErr;
          curErr = nextErr;
          nextErr = tmp;
          nextErr.fill(0);
        }

        return { indices, palette };
      }

      // --- Robust GIF89a LZW Code Stream Encoder ---

      function outputLZWSubblocks(pixels, minCodeSize) {
        const buf = [];
        let curSubblock = 0;

        const clearCode = 1 << minCodeSize;
        const eoiCode = clearCode + 1;
        let nextCode = eoiCode + 1;
        let curCodeSize = minCodeSize + 1;

        let cur = 0;
        let curShift = 0;

        buf.push(0); // Placeholder for first subblock length
        curSubblock = buf.length - 1;

        function emitBytes(bitBlockSize) {
          while (curShift >= bitBlockSize) {
            buf.push(cur & 0xff);
            cur >>= 8;
            curShift -= 8;
            if (buf.length - curSubblock === 256) {
              buf[curSubblock] = 255;
              buf.push(0);
              curSubblock = buf.length - 1;
            }
          }
        }

        function emitCode(c) {
          cur |= c << curShift;
          curShift += curCodeSize;
          emitBytes(8);
        }

        emitCode(clearCode);

        let ibCode = pixels[0];
        let codeTable = {};

        for (let i = 1; i < pixels.length; i++) {
          const k = pixels[i];
          const curKey = (ibCode << 8) | k;
          const curCode = codeTable[curKey];

          if (curCode === undefined) {
            emitCode(ibCode);
            if (nextCode === 4096) {
              emitCode(clearCode);
              nextCode = eoiCode + 1;
              curCodeSize = minCodeSize + 1;
              codeTable = {};
            } else {
              if (nextCode >= 1 << curCodeSize) {
                curCodeSize++;
              }
              codeTable[curKey] = nextCode++;
            }
            ibCode = k;
          } else {
            ibCode = curCode;
          }
        }

        emitCode(ibCode);
        emitCode(eoiCode);

        emitBytes(1);
        if (curShift > 0) {
          buf.push(cur & 0xff);
          cur = 0;
          curShift = 0;
        }

        const lastLen = buf.length - curSubblock - 1;
        if (lastLen > 0) {
          buf[curSubblock] = lastLen;
          buf.push(0); // Block terminator
        } else {
          buf[curSubblock] = 0;
        }

        return buf;
      }

      function encodeLocalPaletteGif(width, height, frames) {
        const bytes = [];
        const push = (...v) => {
          for (let i = 0; i < v.length; i++) bytes.push(v[i]);
        };
        const u16 = (v) => {
          bytes.push(v & 0xff, (v >> 8) & 0xff);
        };

        // GIF89a Header
        push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61);
        u16(width);
        u16(height);
        push(0xf7, 0, 0); // Global palette present, 256 colors

        const defaultPal = frames[0].palette;
        for (let i = 0; i < 256; i++) {
          if (i < defaultPal.length)
            push(defaultPal[i][0], defaultPal[i][1], defaultPal[i][2]);
          else push(0, 0, 0);
        }

        // Netscape 2.0 loop extension
        push(
          0x21,
          0xff,
          0x0b,
          0x4e,
          0x45,
          0x54,
          0x53,
          0x43,
          0x41,
          0x50,
          0x45,
          0x32,
          0x2e,
          0x30,
          0x03,
          0x01,
          0x00,
          0x00,
          0x00,
        );

        for (const f of frames) {
          // Graphic Control Extension (disposal 1 = do not dispose)
          push(0x21, 0xf9, 0x04, 0x04);
          u16(f.delay);
          push(0x00, 0x00);

          // Image Descriptor
          push(0x2c);
          u16(0);
          u16(0);
          u16(width);
          u16(height);

          // 0x87: Local Color Table Flag (bit 7) + 256 colors
          push(0x87);
          for (let i = 0; i < 256; i++) {
            if (i < f.palette.length)
              push(f.palette[i][0], f.palette[i][1], f.palette[i][2]);
            else push(0, 0, 0);
          }

          // Raster data with valid sub-blocks
          push(8); // Min code size
          const subblocks = outputLZWSubblocks(f.indices, 8);
          for (let i = 0; i < subblocks.length; i++) bytes.push(subblocks[i]);
        }

        push(0x3b); // Trailer
        return new Blob([new Uint8Array(bytes)], { type: "image/gif" });
      }

      // --- Procedural Preset Patterns ---

      function createPattern(type) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        if (type === "wheel") {
          for (let y = 0; y < 256; y++) {
            for (let x = 0; x < 256; x++) {
              const dx = x - 128,
                dy = y - 128;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const angle = (Math.atan2(dy, dx) * 180) / Math.PI + 180;
              g.fillStyle =
                dist < 120
                  ? `hsl(${angle}, 90%, ${Math.min(95, dist * 0.7)}%)`
                  : "#000";
              g.fillRect(x, y, 1, 1);
            }
          }
        } else if (type === "checker") {
          for (let i = 0; i < 256; i++) {
            g.fillStyle = `hsl(${i * 2}, 95%, 55%)`;
            g.fillRect(0, i, 256, 1);
          }
        } else if (type === "smiley") {
          g.fillStyle = "#ffcc00";
          g.beginPath();
          g.arc(128, 128, 100, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = "#111";
          g.beginPath();
          g.arc(90, 100, 14, 0, Math.PI * 2);
          g.fill();
          g.beginPath();
          g.arc(166, 100, 14, 0, Math.PI * 2);
          g.fill();
          g.lineWidth = 12;
          g.lineCap = "round";
          g.beginPath();
          g.arc(128, 138, 50, 0.2 * Math.PI, 0.8 * Math.PI);
          g.stroke();
        } else if (type === "rings") {
          g.fillStyle = "#000";
          g.fillRect(0, 0, 256, 256);
          for (let r = 110; r > 10; r -= 20) {
            g.fillStyle = (r / 20) % 2 === 0 ? "#5cc8ff" : "#ff5c8a";
            g.beginPath();
            g.arc(128, 128, r, 0, Math.PI * 2);
            g.fill();
          }
        }
        return c;
      }

      };

      let srcCanvas = null;
      let tgtCanvas = null;

      function renderPreview(canvas, targetPreview) {
        targetPreview.width = canvas.width;
        targetPreview.height = canvas.height;
        targetPreview.getContext("2d").drawImage(canvas, 0, 0);
        targetPreview.closest(".drop-area").classList.add("has-image");
      }
      for (const which of ["src", "tgt"]) {
        const img = new Image();
        img.onload = () => {
          if (which === "src") {
            srcCanvas = img;
            renderPreview(img, prevSrc);
          } else {
            tgtCanvas = img;
            renderPreview(img, prevTgt);
          }
        };
        img.src = SAMPLE_IMAGES[which];
      }

      window.loadSample = function (type, which) {
        const pat = createPattern(type);
        if (which === "src") {
          srcCanvas = pat;
          renderPreview(pat, prevSrc);
        } else {
          tgtCanvas = pat;
          renderPreview(pat, prevTgt);
        }
      };

      // --- Clipboard & Drag-Drop Handling ---

      async function pasteFromClipboard(target) {
        try {
          if (!navigator.clipboard || !navigator.clipboard.read) {
            alert(
              "Clipboard API is not supported in this browser. Please use Ctrl+V / Cmd+V.",
            );
            return;
          }
          const items = await navigator.clipboard.read();
          let loaded = false;
          for (const item of items) {
            const imgType = item.types.find((t) => t.startsWith("image/"));
            if (imgType) {
              const blob = await item.getType(imgType);
              const img = new Image();
              img.onload = () => {
                if (target === "src") {
                  srcCanvas = img;
                  renderPreview(img, prevSrc);
                } else {
                  tgtCanvas = img;
                  renderPreview(img, prevTgt);
                }
              };
              img.src = URL.createObjectURL(blob);
              loaded = true;
              break;
            }
          }
          if (!loaded) {
            alert("No image data found on clipboard. Copy an image first!");
          }
        } catch (err) {
          alert("Clipboard access failed: " + err.message);
        }
      }

      document.getElementById("pasteSrcBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        pasteFromClipboard("src");
      });
      document.getElementById("pasteTgtBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        pasteFromClipboard("tgt");
      });

      // Global paste support (Ctrl+V)
      window.addEventListener("paste", async (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.startsWith("image/")) {
            const blob = items[i].getAsFile();
            const img = new Image();
            img.onload = () => {
              if (document.getElementById("dropTgt").matches(":hover")) {
                tgtCanvas = img;
                renderPreview(img, prevTgt);
              } else {
                srcCanvas = img;
                renderPreview(img, prevSrc);
              }
            };
            img.src = URL.createObjectURL(blob);
            break;
          }
        }
      });

      function setupDrop(dropId, fileId, onLoaded) {
        const drop = document.getElementById(dropId);
        const file = document.getElementById(fileId);
        drop.addEventListener("click", () => file.click());
        file.addEventListener(
          "change",
          () => file.files[0] && load(file.files[0]),
        );
        drop.addEventListener("dragover", (e) => {
          e.preventDefault();
          drop.classList.add("drag");
        });
        drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
        drop.addEventListener("drop", (e) => {
          e.preventDefault();
          drop.classList.remove("drag");
          const f = [...e.dataTransfer.files].find((i) =>
            i.type.startsWith("image/"),
          );
          if (f) load(f);
        });
        function load(f) {
          const img = new Image();
          img.onload = () => onLoaded(img);
          img.src = URL.createObjectURL(f);
        }
      }

      setupDrop("dropSrc", "fileSrc", (img) => {
        srcCanvas = img;
        renderPreview(img, prevSrc);
      });
      setupDrop("dropTgt", "fileTgt", (img) => {
        tgtCanvas = img;
        renderPreview(img, prevTgt);
      });

      // --- Interactive Execution ---

      let lastResult = null;
      let renderer = null;

      const convertBtn = document.getElementById("convert");
      const replayBtn = document.getElementById("replay");
      const saveGifBtn = document.getElementById("saveGif");
      const saveVideoBtn = document.getElementById("saveVideo");
      const statusEl = document.getElementById("status");
      const mainCanvas = document.getElementById("canvas");

      function getHoldMs() {
        return {
          holdStart: +document.getElementById("holdSrc").value * 1000,
          holdEnd: +document.getElementById("holdTgt").value * 1000,
        };
      }

      convertBtn.addEventListener("click", async () => {
        if (!srcCanvas || !tgtCanvas) {
          statusEl.textContent = "Load a source and a target image first.";
          return;
        }
        convertBtn.disabled = true;
        replayBtn.disabled = saveGifBtn.disabled = saveVideoBtn.disabled = true;

        const N = +document.getElementById("res").value;
        const prox = +document.getElementById("prox").value;
        const duration = +document.getElementById("dur").value * 1000;

        statusEl.innerHTML = `Extracting pixels (${N}×${N} = ${N * N} cells)…`;
        await new Promise((r) => setTimeout(r, 10));

        const srcPixels = getGridPixels(srcCanvas, N);
        const tgtPixels = getGridPixels(tgtCanvas, N);

        const t0 = performance.now();
        const assigned = solve5DBipartite(srcPixels, tgtPixels, N, prox);
        const solveTime = (performance.now() - t0).toFixed(1);

        lastResult = { assigned, N, srcPixels };
        renderer = createFastRenderer(mainCanvas, srcPixels, assigned, N);

        statusEl.innerHTML = `Converted <b>${(N * N).toLocaleString()} pixels in ${solveTime} ms</b>. Playing…`;
        const { holdStart, holdEnd } = getHoldMs();
        await animateMorph(renderer, duration, holdStart, holdEnd);

        statusEl.innerHTML = `Done in <b>${solveTime} ms</b>.`;
        convertBtn.disabled = false;
        replayBtn.disabled =
          saveGifBtn.disabled =
          saveVideoBtn.disabled =
            false;
      });

      replayBtn.addEventListener("click", async () => {
        if (!renderer) return;
        const duration = +document.getElementById("dur").value * 1000;
        const { holdStart, holdEnd } = getHoldMs();
        statusEl.textContent = "Replaying…";
        await animateMorph(renderer, duration, holdStart, holdEnd);
        statusEl.textContent = "Replay complete.";
      });

      // TrueColor GIF export
      saveGifBtn.addEventListener("click", async () => {
        if (!renderer || !lastResult) return;
        saveGifBtn.disabled = saveVideoBtn.disabled = replayBtn.disabled = true;

        const fps = +document.getElementById("fps").value;
        const durationSec = +document.getElementById("dur").value;
        const holdSrcSec = +document.getElementById("holdSrc").value;
        const holdTgtSec = +document.getElementById("holdTgt").value;
        const frameCount = Math.max(3, Math.round(durationSec * fps));
        const frames = [];
        // GIF delays are whole centiseconds, so 60 fps lands on 2 cs (50 fps):
        // 100/60 rounds to 2, and most decoders clamp anything below 2 cs there.
        const delay = Math.max(2, Math.round(100 / fps));

        // The output is exactly the grid: N×N, one pixel per cell. The
        // resolution slider is the output size for the preview, the GIF and the
        // video alike, and 1 px cells can never overlap or get resampled.
        const N = lastResult.N;
        const offCanvas = document.createElement("canvas");
        const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });
        const exportRenderer = createFastRenderer(
          offCanvas,
          lastResult.srcPixels,
          lastResult.assigned,
          N,
        );

        for (let i = 0; i <= frameCount; i++) {
          const p = i / frameCount;
          exportRenderer.drawFrame(p);
          const imgData = offCtx.getImageData(0, 0, N, N);

          statusEl.textContent = `Encoding frame ${i + 1}/${frameCount + 1} (${N}×${N})…`;
          const { indices, palette } = quantizeFrameTrueColor(
            imgData.data,
            N,
            N,
          );
          frames.push({
            indices,
            palette,
            delay:
              i === 0
                ? Math.round(holdSrcSec * 100)
                : i === frameCount
                  ? Math.round(holdTgtSec * 100)
                  : delay,
          });
          if (i % 2 === 0) await new Promise((r) => setTimeout(r, 0));
        }

        statusEl.textContent = "Writing GIF…";
        await new Promise((r) => setTimeout(r, 10));

        const gifBlob = encodeLocalPaletteGif(N, N, frames);
        const url = URL.createObjectURL(gifBlob);
        const a = document.createElement("a");
        a.download = "cursed-converter.gif";
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 30000);

        statusEl.textContent = "GIF exported.";
        saveGifBtn.disabled =
          saveVideoBtn.disabled =
          replayBtn.disabled =
            false;
      });

      // 24-bit TrueColor WebM export
      saveVideoBtn.addEventListener("click", async () => {
        if (!renderer || !lastResult) return;
        saveGifBtn.disabled = saveVideoBtn.disabled = replayBtn.disabled = true;
        statusEl.textContent = "Recording video…";

        const stream = mainCanvas.captureStream(30);
        const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm";
        const recorder = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: 6000000,
        });
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.start();

        renderer.drawFrame(0);
        const { holdStart, holdEnd } = getHoldMs();
        await new Promise((r) => setTimeout(r, holdStart));
        await animateMorph(
          renderer,
          +document.getElementById("dur").value * 1000,
        );
        await new Promise((r) => setTimeout(r, holdEnd));

        recorder.stop();
        await new Promise((r) => {
          recorder.onstop = r;
        });

        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = "cursed-converter.webm";
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 30000);

        statusEl.textContent = "Video exported.";
        saveGifBtn.disabled =
          saveVideoBtn.disabled =
          replayBtn.disabled =
            false;
      });

      // Slider value display
      const fmt = {
        res: (v) => `${v} × ${v}`,
        prox: (v) => v,
        dur: (v) => `${(+v).toFixed(1)} s`,
        holdSrc: (v) => `${(+v).toFixed(1)} s`,
        holdTgt: (v) => `${(+v).toFixed(1)} s`,
      };
      [
        ["res", "resVal"],
        ["prox", "proxVal"],
        ["dur", "durVal"],
        ["holdSrc", "holdSrcVal"],
        ["holdTgt", "holdTgtVal"],
      ].forEach(([id, valId]) => {
        const input = document.getElementById(id);
        const label = document.getElementById(valId);
        input.addEventListener("input", () => {
          label.textContent = fmt[id](input.value);
        });
      });
    </script>
  </body>
</html>
